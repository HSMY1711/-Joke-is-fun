<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef3f8">
<meta name="description" content="A small message from M&M (Mind and Memory).">
<title>Sorry for Making Joke of You — M&M</title>
<style>
:root{color-scheme:light;--ink:#182536;--muted:#66778b;--line:rgba(255,255,255,.78);--glass:rgba(255,255,255,.46)}
*{box-sizing:border-box}
html{min-height:100%;background:#edf2f8}
body{margin:0;min-height:100vh;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 15% 12%,rgba(180,211,255,.78),transparent 42%),radial-gradient(ellipse at 86% 22%,rgba(220,202,255,.7),transparent 38%),radial-gradient(ellipse at 52% 100%,rgba(190,226,232,.72),transparent 45%),linear-gradient(145deg,#f6f8fc,#e8eef6)}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.62;animation:float 16s ease-in-out infinite alternate}
.orb.one{width:310px;height:310px;left:-100px;top:28%;background:radial-gradient(circle at 35% 35%,#fff,rgba(156,193,255,.18) 65%,transparent 72%)}
.orb.two{width:390px;height:390px;right:-130px;top:3%;background:radial-gradient(circle at 40% 40%,#fff,rgba(205,177,255,.2) 65%,transparent 72%);animation-delay:-6s}
.orb.three{width:280px;height:280px;right:18%;bottom:-140px;background:radial-gradient(circle at 40% 40%,#fff,rgba(143,214,218,.2) 65%,transparent 72%);animation-delay:-10s}
main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:32px 20px}
.panel{width:min(760px,100%);padding:clamp(34px,7vw,76px) clamp(24px,7vw,76px);text-align:center;border:1px solid var(--line);border-radius:36px;background:linear-gradient(135deg,rgba(255,255,255,.68),rgba(255,255,255,.26));box-shadow:0 30px 90px rgba(54,78,112,.14),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.22);backdrop-filter:blur(28px) saturate(165%);-webkit-backdrop-filter:blur(28px) saturate(165%);animation:arrive .9s cubic-bezier(.2,.8,.2,1) both}
.mark{width:58px;height:58px;margin:0 auto 30px;border-radius:19px;display:grid;place-items:center;font-size:20px;font-weight:700;letter-spacing:-1px;color:#526780;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(211,226,244,.48));border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(60,83,115,.12),inset 0 1px 1px #fff}
h1{max-width:620px;margin:0 auto;font-size:clamp(35px,7vw,64px);line-height:1.04;letter-spacing:-.055em;font-weight:650}
.byline{margin:18px 0 0;color:var(--muted);font-size:clamp(15px,2.5vw,19px);letter-spacing:.01em}
.language-toggle{margin:22px auto 0;padding:10px 19px;border:1px solid rgba(255,255,255,.88);border-radius:999px;color:#40536b;background:linear-gradient(135deg,rgba(255,255,255,.76),rgba(226,236,249,.42));box-shadow:0 7px 22px rgba(61,83,115,.10),inset 0 1px 0 rgba(255,255,255,.95);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
.language-toggle:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(61,83,115,.14),inset 0 1px 0 #fff}
.language-toggle:focus-visible{outline:2px solid #647f9f;outline-offset:4px}
.rule{width:54px;height:1px;margin:46px auto;background:linear-gradient(90deg,transparent,rgba(94,117,146,.42),transparent)}
.signature{margin:0 auto;font-size:clamp(19px,3.8vw,29px);line-height:1.45;letter-spacing:-.035em;font-weight:600}.signature .initials,.signature .name{font:inherit;font-size:1em;letter-spacing:inherit;vertical-align:baseline}
.note{margin:18px 0 0;color:var(--muted);font-size:16px;line-height:1.7}
.footer{margin:34px 0 0;color:rgba(75,94,117,.65);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
@keyframes float{to{transform:translate3d(24px,-22px,0) scale(1.06)}}
@keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:520px){.panel{border-radius:28px;padding:42px 24px}.rule{margin:36px auto}.mark{margin-bottom:26px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><span class="orb one"></span><span class="orb two"></span><span class="orb three"></span></div>
<main>
<section class="panel" aria-labelledby="main-title">
<div class="mark" aria-hidden="true">M&amp;M</div>
<h1 id="main-title" data-english="Sorry for Making Joke of You" data-kannada="ನಿಮ್ಮನ್ನು ತಮಾಷೆ ಮಾಡಿದ್ದಕ್ಕಾಗಿ ಕ್ಷಮಿಸಿ">Sorry for Making Joke of You</h1>
<button class="language-toggle" id="language-toggle" type="button" aria-label="Translate the first sentence into Kannada" aria-pressed="false">ಕನ್ನಡ</button>
<p class="byline">by M&amp;M (Mind and Memory)</p>
<div class="rule" aria-hidden="true"></div>
<h2 class="signature"><span class="initials">AM</span> , Artificial Mind not <span class="name">Anas♥️Mu#$_;:£@</span></h2>
<p class="note">This is a request not from M&amp;M</p>
<p class="footer">A message from M&amp;M</p>
</section>
</main>

<script>
const title = document.getElementById("main-title");
const languageButton = document.getElementById("language-toggle");
languageButton.addEventListener("click", () => {
  const showKannada = languageButton.getAttribute("aria-pressed") !== "true";
  title.textContent = showKannada ? title.dataset.kannada : title.dataset.english;
  languageButton.textContent = showKannada ? "English" : "ಕನ್ನಡ";
  languageButton.setAttribute("aria-pressed", String(showKannada));
  document.documentElement.lang = showKannada ? "kn" : "en";
});
</script>
</body>
</html>
